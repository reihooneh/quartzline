name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the code and nothing else unless they say so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Type check (strict)
        run: npm run check
      - name: Engine tests (physics against exact answers, planner against exhaustive search, hostile files)
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=moderate

  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Rebuild the site and check it matches what's committed
        run: |
          npm run build
          git diff --exit-code -- site
      - name: Browser tests at phone, tablet and desktop sizes
        run: |
          npx playwright install --with-deps chromium
          npm run test:web

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [engine, site]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Publish only the built site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
